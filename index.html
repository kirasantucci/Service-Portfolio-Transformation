<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase2 Service Division Strategy</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#171717; font-family:'Raleway','Segoe UI',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }

  @keyframes gradientSlide { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);} }

  .gate {
    animation: fadeIn 0.6s ease both;
    width: 100%;
    max-width: 440px;
    padding: 48px 40px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    text-align: center;
  }

  .accent-bar {
    width: 48px; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg,#0080ff,#AF23AC,#73f2e5,#FA5B5B);
    background-size: 300% 100%;
    animation: gradientSlide 4s ease infinite;
    margin: 0 auto 28px;
  }

  .logo {
    font-size: 13px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; color: #0080ff; margin-bottom: 8px;
  }

  .title {
    font-size: 22px; font-weight: 200; color: #fff;
    letter-spacing: -0.3px; margin-bottom: 4px;
  }
  .title strong { font-weight: 700; }

  .subtitle {
    font-size: 13px; color: #606060; font-weight: 300;
    margin-bottom: 36px;
  }

  .input-wrap { position: relative; margin-bottom: 16px; }

  input[type=password] {
    width: 100%;
    padding: 14px 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    color: #fff;
    font-family: 'Raleway', sans-serif;
    font-size: 15px;
    letter-spacing: 2px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=password]:focus { border-color: rgba(0,128,255,0.5); }
  input[type=password].error { border-color: rgba(250,91,91,0.6); animation: shake 0.4s ease; }

  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #0080ff, #AF23AC);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-family: 'Raleway', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.88; }

  .err-msg {
    font-size: 12px; color: #FA5B5B; margin-top: 12px;
    min-height: 18px; font-weight: 600;
  }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="accent-bar"></div>
  <div class="logo">Phase2</div>
  <div class="title">Service <strong>Portfolio</strong> Strategy</div>
  <div class="subtitle">This document is confidential. Enter the access password to continue.</div>
  <div class="input-wrap">
    <input type="password" id="pw" placeholder="Password" autofocus
           onkeydown="if(event.key==='Enter')unlock()">
  </div>
  <button onclick="unlock()">Access Document</button>
  <div class="err-msg" id="err"></div>
</div>

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function unlock() {
  const pw = document.getElementById("pw").value;
  const h = await sha256(pw);
  if (h === HASH) {
    const html = atob(DATA);
    document.open(); document.write(html); document.close();
  } else {
    const inp = document.getElementById("pw");
    const err = document.getElementById("err");
    inp.classList.add("error");
    err.textContent = "Incorrect password. Please try again.";
    inp.value = "";
    setTimeout(() => inp.classList.remove("error"), 500);
  }
}
